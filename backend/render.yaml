services:
  - type: web
    name: myhearingbuddy-backend
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 libglib2.0-dev
      pip install -r requirements.txt
    startCommand: python api_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
